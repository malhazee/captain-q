async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "captain_q_v6"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir(parents=True, exist_ok=True)


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("web_app.apk?v=6", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("web_app.tar.gz?v=6", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # Ensure font cache and file path are set without blocking media prompt
    __import__(__name__).__file__ = main
    platform.window.infobox.style.display = "none"

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

        // Simple scroll/viewport reset — does NOT call Pygbag's window_resize

            // Calculate the correct size: min(100vw, 52vh, 480px)
            const vw = window.innerWidth;
            const vh52 = Math.round(window.innerHeight * 0.52);
            const size = Math.min(vw, vh52, 480);
            c.style.setProperty('width', size + 'px', 'important');
            c.style.setProperty('height', size + 'px', 'important');
            c.style.setProperty('max-width', size + 'px', 'important');
            c.style.setProperty('max-height', size + 'px', 'important');

        // Key Dispatcher
        function triggerKey(key, keyCode, code) {
            const canvas = document.getElementById("canvas") || window;
            const evtDown = new KeyboardEvent("keydown", {
                key: key,
                keyCode: keyCode,
                which: keyCode,
                code: code || key,
                bubbles: true,
                cancelable: true
            });
            const evtUp = new KeyboardEvent("keyup", {
                key: key,
                keyCode: keyCode,
                which: keyCode,
                code: code || key,
                bubbles: true,
                cancelable: true
            });

            window.dispatchEvent(evtDown);
            document.dispatchEvent(evtDown);
            if (canvas !== window) canvas.dispatchEvent(evtDown);

            setTimeout(() => {
                window.dispatchEvent(evtUp);
                document.dispatchEvent(evtUp);
                if (canvas !== window) canvas.dispatchEvent(evtUp);
            }, 80);
        }

        // Tap Canvas to skip countdown or confirm with debounce
        let lastCanvasClick = 0;
        const canvasElem = document.getElementById("canvas");

                if (e) e.preventDefault();
                btn.classList.add('active');
                triggerKey(key, keyCode, code);
                clearInterval(timer);
                timer = setInterval(() => {
                    triggerKey(key, keyCode, code);

                if (e) e.preventDefault();
                btn.classList.remove('active');

        // ========== CANVAS FREEZE SYSTEM ==========
        // When the mobile keyboard opens, CSS `vh` units shrink causing the canvas
        // to resize. Pygbag's internal state then gets confused and doesn't restore
        // properly. Solution: freeze canvas to fixed pixel dimensions BEFORE
        // the keyboard appears, and only restore after keyboard fully dismisses.
        let modalIsOpen = false;
        let frozenCanvasWidth = null;
        let frozenCanvasHeight = null;

        function freezeCanvas() {
            const c = document.getElementById('canvas');
            if (!c) return;
            const rect = c.getBoundingClientRect();
            frozenCanvasWidth = Math.round(rect.width);
            frozenCanvasHeight = Math.round(rect.height);
            // Override CSS with fixed pixel values — immune to vh changes
            c.style.setProperty('width', frozenCanvasWidth + 'px', 'important');
            c.style.setProperty('height', frozenCanvasHeight + 'px', 'important');
            c.style.setProperty('max-width', frozenCanvasWidth + 'px', 'important');
            c.style.setProperty('max-height', frozenCanvasHeight + 'px', 'important');
        }

        function unfreezeCanvas() {
            const c = document.getElementById('canvas');
            if (!c) return;
            // Remove inline overrides so the responsive CSS rules take over again
            c.style.removeProperty('width');
            c.style.removeProperty('height');
            c.style.removeProperty('max-width');
            c.style.removeProperty('max-height');
            frozenCanvasWidth = null;
            frozenCanvasHeight = null;
        }

        window.openMobileRegistration = function() {
            // Freeze canvas BEFORE showing modal/keyboard
            freezeCanvas();
            modalIsOpen = true;
            modal.style.display = 'flex';
            const inp = document.getElementById('mobile_name_input');
            if (inp) {
                if (window.activeStudentName && window.activeStudentName !== 'طالب متميز') {
                    inp.value = window.activeStudentName;
                }
                setTimeout(() => {
                    inp.focus({ preventScroll: true });
                }, 150);
            }
        };

        // Modal Open via 👤 button
        const regBtn = document.getElementById('btn_reg');
        if (regBtn) {
            regBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.openMobileRegistration();
            });
            regBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                window.openMobileRegistration();
            });
        }

        // Section Selector in Modal
        let selectedSecIndex = 0;
        const secBtns = modal.querySelectorAll('.sec-btn');
        secBtns.forEach((b, idx) => {
            b.addEventListener('click', () => {
                secBtns.forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                selectedSecIndex = idx;
            });
        });

        // Start from Modal
        const startBtn = document.getElementById('btn_modal_start');
        startBtn.addEventListener('click', submitMobileProfile);
        startBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            submitMobileProfile();
        });

        const nameInput = document.getElementById('mobile_name_input');
        if (nameInput) {
            nameInput.addEventListener('blur', () => {
                if (!modalIsOpen) {
                    setTimeout(enforceViewportReset, 100);
                }
            });
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitMobileProfile();
                }
            });
        }

        // Strictly prevent background scroll offset
        window.addEventListener('scroll', () => {
            if (window.scrollY !== 0 || window.scrollX !== 0) {
                window.scrollTo(0, 0);
            }
        }, { passive: true });

        let isSubmittingProfile = false;
        let blockResizeUntil = 0;  // Timestamp: block resize events until this time

        function submitMobileProfile() {
            if (isSubmittingProfile) return;
            isSubmittingProfile = true;

            const input = document.getElementById('mobile_name_input');
            const btn = document.getElementById('btn_modal_start');
            const rawName = input ? input.value.trim() : '';
            const name = rawName || 'طالب متميز';
            const secList = ["سابع أ", "سابع ب", "سابع ج"];
            const sec = secList[selectedSecIndex] || "سابع أ";

            // Store directly in window object for Python GameState bridge
            window.activeStudentName = name;
            window.activeStudentSection = sec;

            // 1. Instantly drop the soft keyboard by blurring ALL elements
            if (input) {
                input.readOnly = true;  // Prevent re-focus
                input.blur();
            }
            if (document.activeElement) document.activeElement.blur();

            // 2. Provide clear visual feedback on the button
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.75';
                btn.innerText = 'جاري تحضير المتاهة... ⏳';
            }

            // Real-time telemetry: notify teacher's dashboard immediately that student started the session
            const startPayload = {
                student_name: name,
                student_section: sec,
                level_reached: 1,
                score: 0,
                lives_remaining: 3,
                correct_count: 0,
                wrong_count: 0,
                accuracy_rate: "0.0%",
                time_spent_seconds: 0,
                misconceptions: ["🎮 بدأ الجلسة الآن (قيد التحدي)"],
                questions_detail: "بدء التحدي من الهاتف المنزلي",
                timestamp: new Date().toISOString()
            };
            if (window.sendStudentReport) {
                window.sendStudentReport(startPayload);
            }

            // 3. Block ALL resize events for the next 2.5 seconds
            blockResizeUntil = Date.now() + 2500;

            // 4. Wait 500ms for keyboard to FULLY dismiss (iOS needs up to 400ms)
            setTimeout(() => {
                // 5. Hide modal
                modal.style.display = 'none';
                modalIsOpen = false;

                // 6. Restore input for potential re-use
                if (input) input.readOnly = false;
                if (btn) {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.innerText = 'انطلق إلى المتاهة 🚀';
                }

                // 7. Force canvas to correct constrained size (overrides Pygbag)
                enforceViewportReset();
                forceCanvasConstraints();

                // 8. After one more frame, stabilize and start the game
                setTimeout(() => {
                    enforceViewportReset();
                    forceCanvasConstraints();
                    triggerKey('Enter', 13, 'Enter');

                    // 9. Keep forcing constraints for 2 more seconds to beat any delayed Pygbag resize
                    const forceInterval = setInterval(() => {
                        forceCanvasConstraints();
                    }, 200);
                    setTimeout(() => {
                        clearInterval(forceInterval);
                        isSubmittingProfile = false;
                    }, 2000);
                }, 120);
            }, 500);
        }

        // Swipe Gestures on Screen
        let touchX = 0;
        let touchY = 0;
        let touchT = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && !e.target.closest('.touch-btn, .modal-card')) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
                touchT = Date.now();
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1 && !e.target.closest('.touch-btn, .modal-card')) {
                const dx = e.changedTouches[0].clientX - touchX;
                const dy = e.changedTouches[0].clientY - touchY;
                const dt = Date.now() - touchT;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 25 && dt < 600) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) triggerKey('ArrowRight', 39, 'ArrowRight');
                        else triggerKey('ArrowLeft', 37, 'ArrowLeft');
                    } else {
                        if (dy > 0) triggerKey('ArrowDown', 40, 'ArrowDown');
                        else triggerKey('ArrowUp', 38, 'ArrowUp');
                    }
                } else if (dist <= 10 && dt < 250) {
                    // Quick tap on canvas advances countdown or confirms
                    triggerKey('Enter', 13, 'Enter');
                }
            }
        }, { passive: true });

        // Overlay Visibility Check
        function checkControls() {
            // Skip resize handling while modal/keyboard is active or during cooldown
            if (modalIsOpen || Date.now() < blockResizeUntil) return;
            if (window.innerWidth <= 1024 || isTouchDevice) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
            // Re-apply canvas constraints on every resize to override Pygbag
            forceCanvasConstraints();
        }

        window.addEventListener('resize', checkControls);
        window.addEventListener('orientationchange', checkControls);
        setTimeout(checkControls, 1000);
    })();
    </script>
