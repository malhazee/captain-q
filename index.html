<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كابتن كيو - مغامرة الأعداد النسبية | مبادرة جائزة الملكة رانيا</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="google" content="notranslate">
    <meta name="robots" content="notranslate">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app_container">
        <!-- Top student badge -->
        <div id="student_badge_bar">
            <div id="student_badge">👤 طالب مجهول (شعبة أ)</div>
        </div>

        <!-- 1:1 Square Game Canvas -->
        <canvas id="gameCanvas" width="960" height="960"></canvas>

        <!-- Touch Controls (Bottom half of mobile screen) -->
        <div id="touch_controls">
            <!-- D-Pad Directional Cluster -->
            <div class="dpad-cluster">
                <div></div>
                <button id="btn_up" class="touch-btn" aria-label="أعلى">⬆️</button>
                <div></div>
                <button id="btn_left" class="touch-btn" aria-label="يسار">⬅️</button>
                <div></div>
                <button id="btn_right" class="touch-btn" aria-label="يمين">➡️</button>
                <div></div>
                <button id="btn_down" class="touch-btn" aria-label="أسفل">⬇️</button>
                <div></div>
            </div>

            <!-- Action buttons -->
            <div class="action-cluster">
                <button id="btn_reg" class="action-btn reg-btn" title="تعديل الاسم">👤</button>
                <button id="btn_pause" class="action-btn pause-btn" title="إيقاف مؤقت">⏸️</button>
            </div>
        </div>

        <!-- Student Name & Section Modal -->
        <div id="mobile_reg_modal">
            <div class="modal-card">
                <div class="modal-title">🎮 كابتن كيو (Captain-Q)</div>
                <div class="modal-sub">مبادرة الرياضيات - الصف السابع</div>

                <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px; text-align: right;">اسم الطالب الثلاثي:</div>
                <input type="text" id="mobile_name_input" class="modal-input" placeholder="اكتب اسمك الثلاثي هنا..." maxlength="30" autocomplete="off" autofocus>

                <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px; text-align: right;">الشعبة الدراسية:</div>
                <div class="section-selector">
                    <button class="sec-btn selected">شعبة أ</button>
                    <button class="sec-btn">شعبة ب</button>
                    <button class="sec-btn">شعبة ج</button>
                </div>

                <button id="btn_modal_start" class="start-btn">انطلق نحو التحدي 🚀</button>
            </div>
        </div>
    </div>

    <!-- Modular Game Scripts (Ultra-lightweight, 0 external dependencies) -->
    <script src="js/config.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/maze.js"></script>
    <script src="js/math_mission.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
