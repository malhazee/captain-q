    bundle = "captain_q_v4"

    appdir.mkdir(parents=True, exist_ok=True)


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("web_app.apk?v=4", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("web_app.tar.gz?v=4", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache

    __import__(__name__).__file__ = main


    def ui_callback(pkg):

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1

    print("default.tmpl: done")

        // Key Dispatcher
        function triggerKey(key, keyCode, code) {
            const canvas = document.getElementById("canvas") || window;
            const evtDown = new KeyboardEvent("keydown", {
                key: key,
                keyCode: keyCode,
                which: keyCode,
                code: code || key,
                bubbles: true,
                cancelable: true
            });
            const evtUp = new KeyboardEvent("keyup", {
                key: key,
                keyCode: keyCode,
                which: keyCode,
                code: code || key,
                bubbles: true,
                cancelable: true
            });

            window.dispatchEvent(evtDown);
            document.dispatchEvent(evtDown);
            if (canvas !== window) canvas.dispatchEvent(evtDown);

            setTimeout(() => {
                window.dispatchEvent(evtUp);
                document.dispatchEvent(evtUp);
                if (canvas !== window) canvas.dispatchEvent(evtUp);
            }, 80);
        }

        // Attach Continuous Button Holding
        function bindTouchBtn(btnId, key, keyCode, code) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            let timer = null;

            function press(e) {
                if (e) e.preventDefault();
                btn.classList.add('active');
                triggerKey(key, keyCode, code);
                clearInterval(timer);
                timer = setInterval(() => {
                    triggerKey(key, keyCode, code);
                }, 120);
            }

            function release(e) {
                if (e) e.preventDefault();
                btn.classList.remove('active');
                clearInterval(timer);
            }

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        bindTouchBtn('btn_up', 'ArrowUp', 38, 'ArrowUp');
        bindTouchBtn('btn_down', 'ArrowDown', 40, 'ArrowDown');
        bindTouchBtn('btn_left', 'ArrowLeft', 37, 'ArrowLeft');
        bindTouchBtn('btn_right', 'ArrowRight', 39, 'ArrowRight');
        bindTouchBtn('btn_enter', 'Enter', 13, 'Enter');
        bindTouchBtn('btn_pause', 'Escape', 27, 'Escape');
        bindTouchBtn('btn_shield', '1', 49, 'Digit1');

        let selectedSecIndex = 0;
        const secBtns = modal.querySelectorAll('.sec-btn');
        secBtns.forEach((b, idx) => {
            b.addEventListener('click', () => {
                secBtns.forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                selectedSecIndex = idx;
            });
        });

        startBtn.addEventListener('click', submitMobileProfile);
        startBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            submitMobileProfile();
        });

        function submitMobileProfile() {
            const input = document.getElementById('mobile_name_input');
            const name = input.value.trim() || 'طالب متميز';
            modal.style.display = 'none';

            // Clear previous buffer by sending backspaces
            for (let i = 0; i < 25; i++) {
                setTimeout(() => triggerKey('Backspace', 8, 'Backspace'), i * 15);
            }

            // Set section
            setTimeout(() => {
                for (let s = 0; s < selectedSecIndex; s++) {
                    setTimeout(() => triggerKey('Tab', 9, 'Tab'), s * 30);
                }
            }, 400);

            // Type letters
            setTimeout(() => {
                for (let i = 0; i < name.length; i++) {
                    const ch = name[i];
                    setTimeout(() => {
                        const canvas = document.getElementById("canvas") || window;
                        const ev = new KeyboardEvent("keydown", {
                            key: ch,
                            charCode: ch.charCodeAt(0),
                            bubbles: true
                        });
                        window.dispatchEvent(ev);
                        if (canvas !== window) canvas.dispatchEvent(ev);
                    }, i * 35);
                }
            }, 550);

            // Trigger Enter to Start Game
            setTimeout(() => {
                triggerKey('Enter', 13, 'Enter');
            }, 600 + (name.length * 35));
        }

        // Swipe Gestures on Screen
        let touchX = 0;
        let touchY = 0;
        let touchT = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && !e.target.closest('.touch-btn, .modal-card')) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
                touchT = Date.now();
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1 && !e.target.closest('.touch-btn, .modal-card')) {
                const dx = e.changedTouches[0].clientX - touchX;
                const dy = e.changedTouches[0].clientY - touchY;
                const dt = Date.now() - touchT;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 25 && dt < 600) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (dx > 0) triggerKey('ArrowRight', 39, 'ArrowRight');
                        else triggerKey('ArrowLeft', 37, 'ArrowLeft');
                    } else {
                        if (dy > 0) triggerKey('ArrowDown', 40, 'ArrowDown');
                        else triggerKey('ArrowUp', 38, 'ArrowUp');
                    }
                }
            }
        }, { passive: true });

        // Orientation Check
        function checkOrientation() {
            if (window.innerWidth <= 1024) {
                overlay.style.display = 'flex';
                if (window.innerHeight > window.innerWidth) {
                    rotateHint.style.display = 'block';
                } else {
                    rotateHint.style.display = 'none';
                }
            } else {
                overlay.style.display = 'none';
                rotateHint.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        setTimeout(checkOrientation, 1500);

        // Show registration modal automatically on touch phones after initial load
        if (isTouchDevice) {
            setTimeout(() => {
                modal.style.display = 'flex';
            }, 3000);
        }
    })();
    </script>
